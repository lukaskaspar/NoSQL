storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  path: /data/db/mongod.log
  logAppend: true
net:
  port: 27019
  bindIpAll: true
security:
  keyFile: /run/mongo-secrets/mongodb-keyfile
replication:
  replSetName: cfgReplSet
sharding:
  clusterRole: configsvr
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
